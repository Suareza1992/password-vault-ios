name: PasswordVault
options:
  bundleIdPrefix: com.angelsuarez
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # fill in after first open: Signing & Caps → Team

targets:
  PasswordVault:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "README.md"
          - "*.xcodeproj"
          - "*.xcworkspace"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angelsuarez.passwordvault
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock your Password Vault"
    entitlements:
      path: PasswordVault.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.angelsuarez.passwordvault
    dependencies: []
    scheme:
      testTargets: []
